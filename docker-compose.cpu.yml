# CPU-only compose (no NVIDIA GPU). `setup.sh` picks this automatically when GPU is not detected.
#
# Usage:
#   ./setup.sh up -d --build    # auto-picks CPU if no GPU
#   USE_GPU=0 ./setup.sh up -d  # force CPU even if GPU is present

services:
  ros_dev_env:
    container_name: ${ROS_DEV_CONTAINER_NAME}
    image: ${ROS_DEV_CONTAINER_NAME}
    build: ./
    volumes:
      - ${ROS_PROJECT_PATH:-/home/${USER:-user}/ros2_docker}:/home/ubuntu/ros2_ws/
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - DISPLAY=${DISPLAY}
      - LIBGL_ALWAYS_INDIRECT=1    # safer fallback for CPU rendering
      - QT_X11_NO_MITSHM=1
    working_dir: /home/ubuntu/ros2_ws
    # Keep the container running, fix mount ownership, and pre-source ROS (and workspace if built)
    command: >
      bash -lc "sudo chown -R ubuntu:ubuntu /home/ubuntu/ros2_ws || true
      && source /opt/ros/${ROS_DISTRO:-humble}/setup.bash
      && if [ -f install/setup.bash ]; then source install/setup.bash; fi
      && tail -f /dev/null"
    networks:
      - x11
    stdin_open: true
    tty: true

  novnc:
    image: theasp/novnc:latest
    environment:
      - DISPLAY_WIDTH=2560
      - DISPLAY_HEIGHT=1440
    ports:
      - "8080:8080"
    networks:
      - x11
    restart: on-failure

networks:
  x11:
